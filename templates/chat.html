<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suhbat oynasi - Santa Secret 🎄</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 900px; /* Kengligi kattalashtirildi */
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 3px solid rgba(255, 215, 0, 0.6);
        }
        .chat-header {
            background: linear-gradient(90deg, #c0392b, #e74c3c);
            color: white;
            padding: 22px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .chat-header h2 {
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-back {
            text-decoration: none;
            background-color: rgba(255, 255, 255, 0.25);
            color: white;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .btn-back:hover {
            background-color: white;
            color: #c0392b;
            transform: translateY(-2px);
        }
        .messages-box {
            flex: 1;
            height: 520px; /* Balandligi kattalashtirildi */
            overflow-y: auto;
            padding: 25px;
            background-color: #f7f9fc;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }
        /* Custom Scrollbar */
        .messages-box::-webkit-scrollbar {
            width: 8px;
        }
        .messages-box::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        .message {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .my-message {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }
        .other-message {
            background: white;
            color: #2d3748;
            align-self: flex-start;
            border-bottom-left-radius: 3px;
            border: 1px solid #e2e8f0;
        }
        .no-messages {
            text-align: center;
            color: #a0aec0;
            margin-top: auto;
            margin-bottom: auto;
            font-size: 16px;
        }
        .message-form {
            display: flex;
            padding: 20px 25px;
            background: white;
            border-top: 1px solid #edf2f7;
            gap: 15px;
        }
        .message-form input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8fafc;
        }
        .message-form input[type="text"]:focus {
            border-color: #e74c3c;
            background: white;
            box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.1);
        }
        .message-form button {
            background: linear-gradient(135deg, #f12711, #f5af19);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(241, 39, 17, 0.3);
        }
        .message-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(241, 39, 17, 0.4);
        }
        .message-form button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Yuqori qism -->
        <div class="chat-header">
            <a href="{{ url_for('index') }}" class="btn-back">⬅️ Asosiy sahifa</a>
            <h2>🎅 {{ receiver.name if receiver else 'Suhbat' }}</h2>
        </div>

        <!-- Xabarlar chiqadigan qism -->
        <div class="messages-box" id="msgBox">
            {% if messages %}
                {% for msg in messages %}
                    <div class="message {% if msg.sender == current_user.login %}my-message{% else %}other-message{% endif %}">
                        {{ msg.message }}
                    </div>
                {% endfor %}
            {% else %}
                <div class="no-messages">
                    Hozircha xabarlar yo'q. Birinchi bo'lib Yangi yil tabrigini yozing! 🎄✨
                </div>
            {% endif %}
        </div>

        <!-- Xabar yuborish formasi -->
        <form action="{{ url_for('send_message') }}" method="POST" class="message-form">
            <input type="hidden" name="receiver_login" value="{{ receiver.login if receiver else '' }}">
            <input type="text" name="message" placeholder="Xabar yozing..." required autocomplete="off">
            <button type="submit">Yuborish 🎁</button>
        </form>
    </div>

    <script>
        const msgBox = document.getElementById('msgBox');
        msgBox.scrollTop = msgBox.scrollHeight;
    </script>

</body>
</html>
